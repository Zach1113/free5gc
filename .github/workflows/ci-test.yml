name: CI Test

on:
  schedule:
    - cron: '14 19 * * *'  # UTC 19:14 (Local 03:14)
  issue_comment:
    types: [created] # when user comment "#ci-test" in the PR, the workflow will be triggered
  pull_request:
  workflow_dispatch:

env:
  FREE5GC_REPO: https://github.com/free5gc/free5gc
  CI_TEST_REPO: https://github.com/free5gc/ci-test

  CI_TEST_DIR: ci-test
  CI_TEST_FREE5GC_DIR: free5gc

  BUILD_COMPOSE_IT_FILE: composes/build/docker-compose-it.yaml
  BUILD_COMPOSE_E2E_BASIC_FILE: composes/build/docker-compose-e2e-basic.yaml
  BUILD_COMPOSE_E2E_ULCL_FILE: composes/build/docker-compose-e2e-ulcl.yaml

  CI_COMPOSE_IT_FILE: composes/docker-compose-ci-it.yaml
  CI_COMPOSE_E2E_BASIC_FILE: composes/docker-compose-ci-e2e-basic.yaml
  CI_COMPOSE_E2E_ULCL_FILE: composes/docker-compose-ci-e2e-ulcl.yaml

  TIMEOUT: 300

jobs:
  daily-check:
    name: Daily Check
    # if: github.event_name == 'schedule'
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check Command
        run: |
          docker --version
          curl --version
          jq --version
      
      - name: Clone ci-test
        run: |
          rm -rf ${{ env.CI_TEST_DIR }}
          git clone ${{ env.CI_TEST_REPO }}

      - name: Check basic compose
        run: |
          cd ${{ env.CI_TEST_DIR }}

          docker compose -f "$CI_COMPOSE_IT_FILE" up -d --wait --wait-timeout "$TIMEOUT"
          docker compose -f "$CI_COMPOSE_IT_FILE" down

      - name: Run basic tests
        run: |
          cd ${{ env.CI_TEST_DIR }}

          ./ci-test-it.sh --test TestRegistration
          ./ci-test-it.sh --test TestDeregistration
          ./ci-test-it.sh --test TestGUTIRegistration
          ./ci-test-it.sh --test TestEAPAKAPrimeAuthentication
          ./ci-test-it.sh --test TestDuplicateRegistration
          ./ci-test-it.sh --test TestServiceRequest
          ./ci-test-it.sh --test TestPDUSessionReleaseRequest
          ./ci-test-it.sh --test TestNasReroute
          ./ci-test-it.sh --test TestN2Handover
          ./ci-test-it.sh --test TestXnHandover
          ./ci-test-it.sh --test TestPaging
          ./ci-test-it.sh --test TestReSynchronization
          ./ci-test-it.sh --test TestMultiAmfRegistration
          ./ci-test-it.sh --test TestRequestTwoPDUSessions

      - name: Run basic non3gpp tests
        run: |
          cd ${{ env.CI_TEST_DIR }}

          ./ci-test-it.sh --test TestN3iwf
          ./ci-test-it.sh --test TestTngf

      - name: Run basic DC tests
        run: |
          cd ${{ env.CI_TEST_DIR }}

          ./ci-test-it.sh --test TestDC
          ./ci-test-it.sh --test TestDynamicDC
          ./ci-test-it.sh --test TestXnDcHandover

      - name: Check E2E basic compose
        run: |
          cd ${{ env.CI_TEST_DIR }}

          docker compose -f "$CI_COMPOSE_E2E_BASIC_FILE" up -d --wait --wait-timeout "$TIMEOUT"
          docker compose -f "$CI_COMPOSE_E2E_BASIC_FILE" down

      - name: Run E2E basic tests
        run: |
          cd ${{ env.CI_TEST_DIR }}

          ./ci-test-e2e-basic.sh --test TestRegPduCharging

      - name: Check E2E ULCL compose
        run: |
          cd ${{ env.CI_TEST_DIR }}

          docker compose -f "$CI_COMPOSE_E2E_ULCL_FILE" up -d --wait --wait-timeout "$TIMEOUT"
          docker compose -f "$CI_COMPOSE_E2E_ULCL_FILE" down

      - name: Run E2E ULCL tests
        run: |
          cd ${{ env.CI_TEST_DIR }}

          ./ci-test-e2e-ulcl.sh --test TestULCLTrafficInfluence
          ./ci-test-e2e-ulcl.sh --test TestULCLMultiPathUe

      - name: Cleanup docker resources
        if: always()
        run: |
          docker system prune -a -f
          docker volume prune -a -f

      - name: Clean up clone repositories
        if: always()
        run: |
          rm -rf ${{ env.CI_TEST_DIR }}


  source-code-test:
    name: Source Code Test
    if: (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '#ci-test')) || github.event_name == 'workflow_dispatch'
    # if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check Command
        run: |
          docker --version
          curl --version
          jq --version

      - name: Clone free5gc/ci-test & init free5gc
        run: |
          rm -rf ${{ env.CI_TEST_DIR }}
          git clone ${{ env.CI_TEST_REPO }}
          cd ${{ env.CI_TEST_DIR }}
          git clone -j `nproc` --recursive ${{ env.FREE5GC_REPO }}
          cd ${{ env.CI_TEST_FREE5GC_DIR }}
          git submodule foreach git checkout main
          git submodule foreach git pull origin main

      - name: Build Base Images
        run: |
          cd ${{ env.CI_TEST_DIR }}
          make

      - name: Check basic compose
        run: |
          docker compose -f "$BUILD_COMPOSE_IT_FILE" up -d --wait --wait-timeout "$TIMEOUT"
          docker compose -f "$BUILD_COMPOSE_IT_FILE" down

      - name: Run basic tests
        run: |
          ./ci-test-it.sh --build --test TestRegistration
          ./ci-test-it.sh --build --test TestDeregistration
          ./ci-test-it.sh --build --test TestGUTIRegistration
          ./ci-test-it.sh --build --test TestEAPAKAPrimeAuthentication
          ./ci-test-it.sh --build --test TestDuplicateRegistration
          ./ci-test-it.sh --build --test TestServiceRequest
          ./ci-test-it.sh --build --test TestPDUSessionReleaseRequest
          ./ci-test-it.sh --build --test TestNasReroute
          ./ci-test-it.sh --build --test TestN2Handover
          ./ci-test-it.sh --build --test TestXnHandover
          ./ci-test-it.sh --build --test TestPaging
          ./ci-test-it.sh --build --test TestReSynchronization
          ./ci-test-it.sh --build --test TestMultiAmfRegistration
          ./ci-test-it.sh --build --test TestRequestTwoPDUSessions

      - name: Run basic non3gpp tests
        run: |
          ./ci-test-it.sh --build --test TestN3iwf
          ./ci-test-it.sh --build --test TestTngf

      - name: Run basic DC tests
        run: |
          ./ci-test-it.sh --build --test TestDC
          ./ci-test-it.sh --build --test TestDynamicDC
          ./ci-test-it.sh --build --test TestXnDcHandover

      - name: Check E2E basic compose
        run: |
          docker compose -f "$BUILD_COMPOSE_E2E_BASIC_FILE" up -d --wait --wait-timeout "$TIMEOUT"
          docker compose -f "$BUILD_COMPOSE_E2E_BASIC_FILE" down

      - name: Run E2E basic tests
        run: |
          ./ci-test-e2e-basic.sh --build --test TestRegPduCharging

      - name: Check E2E ULCL compose
        run: |
          docker compose -f "$BUILD_COMPOSE_E2E_ULCL_FILE" up -d --wait --wait-timeout "$TIMEOUT"
          docker compose -f "$BUILD_COMPOSE_E2E_ULCL_FILE" down

      - name: Run E2E ULCL tests
        run: |
          ./ci-test-e2e-ulcl.sh --build --test TestULCLTrafficInfluence
          ./ci-test-e2e-ulcl.sh --build --test TestULCLMultiPathUe

      - name: Cleanup docker resources
        if: always()
        run: |
          echo "Cleaning up docker resources..."
          docker system prune -a -f
          docker volume prune -a -f

      - name: Clean up clone repositories
        if: always()
        run: |
          rm -rf ${{ env.CI_TEST_DIR }}
